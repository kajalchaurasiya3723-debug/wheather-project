<html>
<head>
   
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="weather">
<h1>🌤️ Weather App</h1>
<div class="search">
<input type="text" id="city"placeholder="Enter City Name">
<button onclick="getWeather()">Search</button>
</div>
<div id="result">
<h2 id="cityName"></h2>
<h1 id="temperature"></h1>
<p id="condition"></p>
<p id="humidity"></p>
<p id="wind"></p>
</div>
<p id="message"></p>
</div>
<script src="script.js"></script>
</body>
</html>
